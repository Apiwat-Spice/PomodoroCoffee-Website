<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Coffee</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4e7d3;
        }

        /* แก้วกาแฟ */
        .coffee {
            width: 220px;
            height: 160px;
            background: #6f4e37;
            margin: 40px auto;
            border-radius: 0 0 100px 100px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        /* หูแก้ว */
        .coffee::after {
            content: "";
            position: absolute;
            right: -50px;
            top: 30px;
            width: 60px;
            height: 80px;
            border: 12px solid #6f4e37;
            border-radius: 50%;
        }

        /* ฟองกาแฟ */
        .foam {
            width: 220px;
            height: 30px;
            background: #fff;
            border-radius: 20px;
            margin: auto;
        }

        input {
            padding: 8px;
            width: 80px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>☕ Pomodoro Coffee</h1>

    <div class="foam"></div>

    <div class="coffee">
        <span id="display">00:00</span>
    </div>

    <h3>Set Time (minutes)</h3>

    <input type="number" id="timer" value="25">

    <button onclick="startTimer()">Start</button>

    <audio id="alarm" src="ack.mp3"></audio>

    <script>

        let countdown;

        function startTimer() {

            let minutes = document.getElementById("timer").value;
            let time = minutes * 60;

            clearInterval(countdown);

            countdown = setInterval(() => {

                let min = Math.floor(time / 60);
                let sec = time % 60;

                document.getElementById("display").textContent =
                    min + ":" + sec.toString().padStart(2, "0");

                time--;

                if (time < 0) {
                    clearInterval(countdown);
                    document.getElementById("display").textContent = "หมดเวลา ☕";
                    document.getElementById("alarm").play();
                }

            }, 1000);

        }

    </script>

</body>

</html>
